name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: ${{ matrix.compiler }}
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - compiler: GCC
            cxx: g++
          - compiler: Clang
            cxx: clang++

    steps:
      - uses: actions/checkout@v4
      - name: Install YAML dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev
      - name: Configure
        run: >-
          cmake -S . -B build
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=${{ matrix.cxx }}
      - name: Build
        run: cmake --build build --parallel 2
      - name: Test
        run: ctest --test-dir build --output-on-failure
      - name: Install smoke test
        run: cmake --install build --prefix "${{ runner.temp }}/cxx-dead-install"

  sanitizers:
    name: ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install YAML dependency
        run: |
          sudo apt-get update
          sudo apt-get install -y libyaml-cpp-dev
      - name: Configure
        run: >-
          cmake -S . -B build-sanitized
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_COMPILER=clang++
          -DCMAKE_CXX_FLAGS="-fsanitize=address,undefined -fno-omit-frame-pointer"
          -DCMAKE_EXE_LINKER_FLAGS="-fsanitize=address,undefined"
      - name: Build
        run: cmake --build build-sanitized --parallel 2
      - name: Test
        env:
          ASAN_OPTIONS: detect_leaks=1
          UBSAN_OPTIONS: print_stacktrace=1
        run: ctest --test-dir build-sanitized --output-on-failure

  libtooling:
    name: LibTooling (Clang 18)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install Clang development libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y clang-18 libclang-18-dev llvm-18-dev libyaml-cpp-dev
      - name: Configure
        run: >-
          cmake -S . -B build-libtooling
          -DCMAKE_BUILD_TYPE=Release
          -DCMAKE_CXX_COMPILER=clang++-18
          -DCXX_DEAD_ENABLE_LIBTOOLING=ON
          -DLLVM_DIR=/usr/lib/llvm-18/lib/cmake/llvm
          -DClang_DIR=/usr/lib/llvm-18/lib/cmake/clang
      - name: Build
        run: cmake --build build-libtooling --parallel 2
      - name: Test
        run: ctest --test-dir build-libtooling --output-on-failure
      - name: Install smoke test
        run: |
          cmake --install build-libtooling --prefix "${{ runner.temp }}/cxx-dead-install"
          "${{ runner.temp }}/cxx-dead-install/bin/cxx-dead" --version
